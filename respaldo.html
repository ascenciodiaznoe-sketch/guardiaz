<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Respaldo GuardiaZ</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: #18181b;
            color: #fff;
            padding: 20px;
            margin: 0;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
        }
        h1 {
            font-size: 22px;
            color: #ef4444;
            margin-bottom: 5px;
        }
        p {
            color: #d1d5db;
            line-height: 1.5;
        }
        .resumen {
            background: #27272a;
            border-radius: 10px;
            padding: 16px;
            margin: 20px 0;
        }
        .fila {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #3f3f46;
        }
        .fila:last-child { border-bottom: none; }
        .num {
            font-weight: bold;
            color: #4ade80;
            font-size: 18px;
        }
        button {
            width: 100%;
            padding: 16px;
            border-radius: 10px;
            border: none;
            font-weight: bold;
            font-size: 16px;
            margin-top: 12px;
            cursor: pointer;
        }
        .btn-verde { background: #16a34a; color: white; }
        .btn-azul { background: #2563eb; color: white; }
        #estado {
            margin-top: 15px;
            padding: 12px;
            border-radius: 8px;
            display: none;
        }
        .ok { background: #14532d; color: #bbf7d0; display: block !important; }
        .error { background: #7f1d1d; color: #fecaca; display: block !important; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🛡️ Respaldo de Emergencia</h1>
        <p>Esta página lee directamente lo que está guardado en tu celular, sin pasar por la app principal.</p>

        <div class="resumen" id="resumen">
            <div class="fila">
                <span>📦 Componentes</span>
                <span class="num" id="numParts">...</span>
            </div>
            <div class="fila">
                <span>📋 Recetas</span>
                <span class="num" id="numRecipes">...</span>
            </div>
            <div class="fila">
                <span>📊 Aparatos en historial</span>
                <span class="num" id="numHistory">...</span>
            </div>
            <div class="fila">
                <span>🏪 Proveedores</span>
                <span class="num" id="numSuppliers">...</span>
            </div>
        </div>

        <button class="btn-verde" onclick="descargar()">📥 Descargar Respaldo (JSON)</button>
        <button class="btn-azul" onclick="copiarTexto()">📋 Copiar todo como Texto</button>

        <div id="estado"></div>
    </div>

    <script>
        function leerDatos() {
            return {
                fecha: new Date().toLocaleString('es-MX'),
                parts: localStorage.getItem('inventory-parts'),
                recipes: localStorage.getItem('inventory-recipes'),
                history: localStorage.getItem('inventory-history'),
                suppliers: localStorage.getItem('inventory-suppliers')
            };
        }

        function mostrarResumen() {
            try {
                const datos = leerDatos();
                const parts = datos.parts ? JSON.parse(datos.parts) : [];
                const recipes = datos.recipes ? JSON.parse(datos.recipes) : [];
                const history = datos.history ? JSON.parse(datos.history) : [];
                const suppliers = datos.suppliers ? JSON.parse(datos.suppliers) : [];

                document.getElementById('numParts').textContent = parts.length;
                document.getElementById('numRecipes').textContent = recipes.length;
                document.getElementById('numHistory').textContent = history.length;
                document.getElementById('numSuppliers').textContent = suppliers.length;
            } catch (e) {
                document.getElementById('resumen').innerHTML =
                    '<p style="color:#fca5a5">No se pudo leer el resumen, pero el botón de descargar puede funcionar igual. Error: ' + e.message + '</p>';
            }
        }

        function descargar() {
            try {
                const datos = leerDatos();
                const blob = new Blob([JSON.stringify(datos, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'GuardiaZ-Respaldo-' + new Date().toISOString().slice(0,10) + '.json';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                mostrarEstado('✅ Descargado. Revisa tu carpeta de Descargas o las notificaciones.', 'ok');
            } catch (e) {
                mostrarEstado('❌ Error al descargar: ' + e.message, 'error');
            }
        }

        function copiarTexto() {
            try {
                const datos = leerDatos();
                const texto = JSON.stringify(datos, null, 2);
                navigator.clipboard.writeText(texto).then(() => {
                    mostrarEstado('✅ Copiado. Pégalo en una nota o WhatsApp para guardarlo.', 'ok');
                }).catch(() => {
                    // Fallback para navegadores viejos
                    const textarea = document.createElement('textarea');
                    textarea.value = texto;
                    document.body.appendChild(textarea);
                    textarea.select();
                    document.execCommand('copy');
                    document.body.removeChild(textarea);
                    mostrarEstado('✅ Copiado. Pégalo en una nota o WhatsApp para guardarlo.', 'ok');
                });
            } catch (e) {
                mostrarEstado('❌ Error al copiar: ' + e.message, 'error');
            }
        }

        function mostrarEstado(msg, tipo) {
            const el = document.getElementById('estado');
            el.textContent = msg;
            el.className = tipo;
        }

        mostrarResumen();
    </script>
</body>
</html>
