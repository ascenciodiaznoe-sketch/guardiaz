<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurar GuardiaZ</title>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; background: #18181b; color: #fff; padding: 20px; margin: 0; }
        .container { max-width: 500px; margin: 0 auto; }
        h1 { font-size: 22px; color: #4ade80; margin-bottom: 5px; }
        p { color: #d1d5db; line-height: 1.5; }
        input[type="file"] {
            width: 100%;
            padding: 14px;
            background: #27272a;
            border: 2px dashed #4ade80;
            border-radius: 10px;
            color: #fff;
            margin: 16px 0;
        }
        button {
            width: 100%;
            padding: 18px;
            border-radius: 10px;
            border: none;
            font-weight: bold;
            font-size: 17px;
            margin-top: 10px;
            cursor: pointer;
        }
        .btn-restaurar { background: #16a34a; color: white; }
        .resumen {
            background: #27272a;
            border-radius: 10px;
            padding: 16px;
            margin: 16px 0;
            display: none;
        }
        .fila { display: flex; justify-content: space-between; padding: 6px 0; }
        .num { font-weight: bold; color: #4ade80; }
        #estado { margin-top: 16px; padding: 14px; border-radius: 8px; display: none; line-height: 1.5; white-space: pre-line; }
        .ok { background: #14532d; color: #bbf7d0; display: block !important; }
        .error { background: #7f1d1d; color: #fecaca; display: block !important; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📥 Restaurar Datos GuardiaZ</h1>
        <p>Selecciona el archivo <strong>.json</strong> que descargaste como respaldo (algo como "GuardiaZ-Respaldo-2026-06-17.json").</p>

        <input type="file" id="archivo" accept=".json">

        <div class="resumen" id="resumen">
            <div class="fila"><span>📦 Componentes</span><span class="num" id="numParts">-</span></div>
            <div class="fila"><span>📋 Recetas</span><span class="num" id="numRecipes">-</span></div>
            <div class="fila"><span>📊 Aparatos historial</span><span class="num" id="numHistory">-</span></div>
            <div class="fila"><span>🏪 Proveedores</span><span class="num" id="numSuppliers">-</span></div>
        </div>

        <button class="btn-restaurar" id="btnRestaurar" onclick="restaurar()" disabled>📥 Restaurar estos Datos</button>

        <div id="estado"></div>
    </div>

    <script>
        let datosLeidos = null;

        document.getElementById('archivo').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(evt) {
                try {
                    const contenido = JSON.parse(evt.target.result);
                    datosLeidos = contenido;

                    const parts = contenido.parts ? JSON.parse(contenido.parts) : [];
                    const recipes = contenido.recipes ? JSON.parse(contenido.recipes) : [];
                    const history = contenido.history ? JSON.parse(contenido.history) : [];
                    const suppliers = contenido.suppliers ? JSON.parse(contenido.suppliers) : [];

                    document.getElementById('numParts').textContent = parts.length;
                    document.getElementById('numRecipes').textContent = recipes.length;
                    document.getElementById('numHistory').textContent = history.length;
                    document.getElementById('numSuppliers').textContent = suppliers.length;
                    document.getElementById('resumen').style.display = 'block';
                    document.getElementById('btnRestaurar').disabled = false;
                    mostrarEstado('✅ Archivo leído correctamente. Revisa los números arriba antes de restaurar.', 'ok');
                } catch (err) {
                    mostrarEstado('❌ Este archivo no se pudo leer. Asegúrate de elegir el .json correcto.\n\nError: ' + err.message, 'error');
                    document.getElementById('btnRestaurar').disabled = true;
                }
            };
            reader.readAsText(file);
        });

        function restaurar() {
            if (!datosLeidos) return;

            const confirmar = confirm('¿Restaurar estos datos?\n\nEsto va a reemplazar lo que esté guardado actualmente en este celular con la información de tu archivo.');
            if (!confirmar) return;

            try {
                if (datosLeidos.parts) localStorage.setItem('inventory-parts', datosLeidos.parts);
                if (datosLeidos.recipes) localStorage.setItem('inventory-recipes', datosLeidos.recipes);
                if (datosLeidos.history) localStorage.setItem('inventory-history', datosLeidos.history);
                if (datosLeidos.suppliers) localStorage.setItem('inventory-suppliers', datosLeidos.suppliers);

                mostrarEstado('✅ ¡Datos restaurados! Ahora cierra esta pestaña y abre tu app normal (index.html).', 'ok');
            } catch (e) {
                mostrarEstado('❌ Error al restaurar: ' + e.message, 'error');
            }
        }

        function mostrarEstado(msg, tipo) {
            const el = document.getElementById('estado');
            el.textContent = msg;
            el.className = tipo;
        }
    </script>
</body>
</html>
